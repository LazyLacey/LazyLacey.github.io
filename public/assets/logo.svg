<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <filter id="s1">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <filter id="s2">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Icon: stacked cards, scaled to 80px height -->

  <!-- Back card — green -->
  <g transform="translate(43, 42) rotate(-13)" filter="url(#s1)">
    <rect x="-18" y="-23" width="36" height="46" rx="6.5" fill="#2B7A52"/>
  </g>

  <!-- Middle card — purple -->
  <g transform="translate(41, 41) rotate(-6)" filter="url(#s1)">
    <rect x="-18" y="-23" width="36" height="46" rx="6.5" fill="#5B3DB8"/>
  </g>

  <!-- Front card — gold -->
  <g transform="translate(39, 40) rotate(3)" filter="url(#s2)">
    <rect x="-18" y="-23" width="36" height="46" rx="6.5" fill="#F0A828"/>
    <rect x="-18" y="-23" width="36" height="12" rx="6.5" fill="#F8C040" opacity="0.45"/>
    <rect x="-18" y="-11" width="36" height="1.5" fill="#F8C040" opacity="0.25"/>
    <rect x="-10" y="-5"  width="20" height="5" rx="2.5" fill="#fff" opacity="0.92"/>
    <rect x="-10" y="3"   width="20" height="5" rx="2.5" fill="#fff" opacity="0.92"/>
  </g>

  <!-- Wordmark: Fișki -->
  <text
    x="96" y="52"
    font-family="'Syne', 'DM Sans', system-ui, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#F0F0F8">
    Fi<tspan fill="#F0A828">ș</tspan>ki
  </text>
</svg>
