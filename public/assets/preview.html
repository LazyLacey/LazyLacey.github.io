<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon Preview</title>
<style>
  body { margin: 0; background: #0f0f1a; font-family: system-ui; color: #eee; padding: 40px; }
  h2 { color: #555; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 32px 0 14px; }
  .row { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .item { text-align: center; }
  .label { font-size: 11px; color: #444; margin-top: 8px; }
  img { display: block; border-radius: 19%; }
</style>
</head>
<body>

<h2>Варианты градиента</h2>
<div class="row">
  <div class="item">
    <img src="icon-diagonal.png" width="180" height="180">
    <div class="label">Диагональный</div>
  </div>
  <div class="item">
    <img src="icon-radial_c.png" width="180" height="180">
    <div class="label">Радиальный (центр)</div>
  </div>
  <div class="item">
    <img src="icon-radial_tl.png" width="180" height="180">
    <div class="label">Радиальный (верх-лево)</div>
  </div>
  <div class="item">
    <img src="icon-top_bottom.png" width="180" height="180">
    <div class="label">Сверху вниз</div>
  </div>
  <div class="item">
    <img src="icon-vignette.png" width="180" height="180">
    <div class="label">Виньетка</div>
  </div>
</div>

<h2>Выбранный (виньетка) — разные размеры</h2>
<div class="row">
  <div class="item">
    <img src="icon-512.png" width="256" height="256">
    <div class="label">512px</div>
  </div>
  <div class="item">
    <img src="icon-192.png" width="192" height="192">
    <div class="label">192px</div>
  </div>
  <div class="item">
    <img src="icon-192.png" width="96" height="96">
    <div class="label">96px</div>
  </div>
  <div class="item">
    <img src="icon-192.png" width="60" height="60">
    <div class="label">60px</div>
  </div>
</div>

</body>
</html>
