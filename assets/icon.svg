<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Back card — dark green, rotated left -->
  <g transform="translate(104, 108) rotate(-13)" filter="url(#shadow)">
    <rect x="-44" y="-58" width="88" height="116" rx="16" fill="#2B7A52"/>
    <rect x="-44" y="-58" width="88" height="116" rx="16" fill="url(#green-shine)" opacity="0.15"/>
  </g>

  <!-- Middle card — purple, slight rotation -->
  <g transform="translate(100, 106) rotate(-6)" filter="url(#shadow)">
    <rect x="-44" y="-58" width="88" height="116" rx="16" fill="#5B3DB8"/>
  </g>

  <!-- Front card — gold, almost upright -->
  <g transform="translate(96, 104) rotate(3)" filter="url(#shadow-sm)">
    <rect x="-44" y="-58" width="88" height="116" rx="16" fill="#F0A828"/>
    <!-- Highlight at top -->
    <rect x="-44" y="-58" width="88" height="30" rx="16" fill="#F8C040" opacity="0.5"/>
    <rect x="-44" y="-28" width="88" height="4" fill="#F8C040" opacity="0.3"/>
    <!-- Two horizontal slots -->
    <rect x="-26" y="-12" width="52" height="12" rx="6" fill="#fff" opacity="0.92"/>
    <rect x="-26" y="8"  width="52" height="12" rx="6" fill="#fff" opacity="0.92"/>
  </g>
</svg>
